backend:
  name: github
  repo: stefanoraguiar/porto-nao-mono
  branch: main
  # Must match the domain you open /admin from (custom domain, not *.netlify.app)
  site_domain: portonaomonogamico.com


media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. EVENTOS
  - name: "events"
    label: "Eventos"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} {{approved}}"
    fields:
      - { label: "Aprovado / Publicado", name: "approved", widget: "boolean", default: true, hint: "Desmarca para manter como pendente. Sugestões da comunidade entram automaticamente como não aprovadas." }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data e Hora do Evento", name: "eventDate", widget: "datetime" }
      - { label: "Localização", name: "location", widget: "string" }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        required: false
        allow_add: true
        field: { label: "Etiqueta", name: "tag", widget: "string" }
      - { label: "Fotos do Evento (URL)", name: "photosUrl", widget: "string", required: false, hint: "Link para o álbum de fotografias do evento" }
      - { label: "Evento Externo", name: "external", widget: "boolean", default: false, hint: "Marca se o evento não é organizado pela comunidade Porto Não-Monogâmico" }
      - { label: "Sugerido por (nome)", name: "suggestedBy", widget: "string", required: false }
      - { label: "Sugerido por (e-mail)", name: "suggestedEmail", widget: "string", required: false }
      - { label: "Descrição", name: "body", widget: "markdown", required: false }

  # 1b. EVENTOS PENDENTES (mesma pasta, só não aprovados)
  - name: "pending-events"
    label: "Eventos Pendentes"
    folder: "src/content/events"
    create: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter:
      field: approved
      value: false
    fields:
      - { label: "Aprovado / Publicado", name: "approved", widget: "boolean", default: false, hint: "Marca para publicar o evento no site (após o próximo deploy)." }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data e Hora do Evento", name: "eventDate", widget: "datetime" }
      - { label: "Localização", name: "location", widget: "string" }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        required: false
        allow_add: true
        field: { label: "Etiqueta", name: "tag", widget: "string" }
      - { label: "Fotos do Evento (URL)", name: "photosUrl", widget: "string", required: false }
      - { label: "Evento Externo", name: "external", widget: "boolean", default: false }
      - { label: "Sugerido por (nome)", name: "suggestedBy", widget: "string", required: false }
      - { label: "Sugerido por (e-mail)", name: "suggestedEmail", widget: "string", required: false }
      - { label: "Descrição", name: "body", widget: "markdown", required: false }

  # 2. ARTIGOS
  - name: "articles"
    label: "Artigos"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "date", widget: "datetime" }
      - { label: "Autor(a)", name: "author", widget: "string", default: "Tertúlias Não Mónó" }
      - { label: "Imagem de Capa", name: "image", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  # 3. GALERIA DE FOTOS
  - name: "galleries"
    label: "Galeria de Fotos"
    folder: "src/content/galleries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Álbum", name: "title", widget: "string" }
      - { label: "Data do Evento", name: "eventDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Localização", name: "location", widget: "string", default: "Porto" }
      - label: "Fotografias"
        name: "photos"
        widget: "list"
        required: false
        summary: "{{fields.caption}} — {{fields.url}}"
        fields:
          - { label: "Fotografia", name: "url", widget: "image" }
          - { label: "Legenda", name: "caption", widget: "string", required: false, hint: "Opcional — ex: crédito do fotógrafo ou descrição" }

  # 4. PROFISSIONAIS
  - name: "professionals"
    label: "Profissionais"
    folder: "src/content/professionals"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} {{approved}}"
    fields:
      - { label: "Aprovado / Publicado", name: "approved", widget: "boolean", default: true, hint: "Desmarca para manter como pendente. Sugestões da comunidade entram automaticamente como não aprovadas." }
      - { label: "Nome", name: "title", widget: "string" }
      - { label: "Especialidade / Cargo", name: "role", widget: "string", hint: "Ex: Psicóloga clínica, Advogada, Mediador familiar" }
      - label: "Áreas"
        name: "areas"
        widget: "list"
        required: false
        allow_add: true
        hint: "Ex: Terapia, Direito, Educação, Coaching"
        field: { label: "Área", name: "area", widget: "string" }
      - { label: "Localização", name: "location", widget: "string", required: false, default: "Porto" }
      - { label: "Contacto", name: "contact", widget: "string", required: false, hint: "E-mail, telefone ou link de contacto" }
      - { label: "Website / Perfil", name: "website", widget: "string", required: false }
      - { label: "Fotografia", name: "image", widget: "image", required: false }
      - { label: "Profissional da comunidade", name: "community", widget: "boolean", default: false, hint: "Marca se o profissional também faz parte da comunidade Porto Não-Monogâmico" }
      - { label: "Sugerido por (nome)", name: "suggestedBy", widget: "string", required: false }
      - { label: "Sugerido por (e-mail)", name: "suggestedEmail", widget: "string", required: false }
      - { label: "Bio / Apresentação", name: "body", widget: "markdown", required: false }

  # 4b. PROFISSIONAIS PENDENTES
  - name: "pending-professionals"
    label: "Profissionais Pendentes"
    folder: "src/content/professionals"
    create: false
    slug: "{{slug}}"
    filter:
      field: approved
      value: false
    fields:
      - { label: "Aprovado / Publicado", name: "approved", widget: "boolean", default: false, hint: "Marca para publicar o profissional no site (após o próximo deploy)." }
      - { label: "Nome", name: "title", widget: "string" }
      - { label: "Especialidade / Cargo", name: "role", widget: "string" }
      - label: "Áreas"
        name: "areas"
        widget: "list"
        required: false
        allow_add: true
        field: { label: "Área", name: "area", widget: "string" }
      - { label: "Localização", name: "location", widget: "string", required: false }
      - { label: "Contacto", name: "contact", widget: "string", required: false }
      - { label: "Website / Perfil", name: "website", widget: "string", required: false }
      - { label: "Fotografia", name: "image", widget: "image", required: false }
      - { label: "Profissional da comunidade", name: "community", widget: "boolean", default: false }
      - { label: "Sugerido por (nome)", name: "suggestedBy", widget: "string", required: false }
      - { label: "Sugerido por (e-mail)", name: "suggestedEmail", widget: "string", required: false }
      - { label: "Bio / Apresentação", name: "body", widget: "markdown", required: false }

  # 5. BIBLIOTECA
  - name: "books"
    label: "Biblioteca"
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} {{approved}}"
    fields:
      - { label: "Aprovado / Publicado", name: "approved", widget: "boolean", default: true, hint: "Desmarca para manter como pendente. Sugestões da comunidade entram automaticamente como não aprovadas." }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Capa", name: "image", widget: "image", required: false }
      - { label: "Link", name: "link", widget: "string", hint: "URL para comprar, ler ou saber mais sobre o livro" }
      - { label: "Descrição curta", name: "description", widget: "text", hint: "Uma ou duas frases sobre o livro" }
      - label: "Etiquetas"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options: ["Acesso livre", "Comercial"]
        hint: "Marca se o link é de acesso livre (legal/gratuito) ou comercial (compra)."
      - { label: "Sugerido por (nome)", name: "suggestedBy", widget: "string", required: false }
      - { label: "Sugerido por (e-mail)", name: "suggestedEmail", widget: "string", required: false }

  # 5b. BIBLIOTECA PENDENTE
  - name: "pending-books"
    label: "Biblioteca Pendente"
    folder: "src/content/books"
    create: false
    slug: "{{slug}}"
    filter:
      field: approved
      value: false
    fields:
      - { label: "Aprovado / Publicado", name: "approved", widget: "boolean", default: false, hint: "Marca para publicar o livro no site (após o próximo deploy)." }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Capa", name: "image", widget: "image", required: false }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Descrição curta", name: "description", widget: "text", required: false }
      - label: "Etiquetas"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options: ["Acesso livre", "Comercial"]
      - { label: "Sugerido por (nome)", name: "suggestedBy", widget: "string", required: false }
      - { label: "Sugerido por (e-mail)", name: "suggestedEmail", widget: "string", required: false }
