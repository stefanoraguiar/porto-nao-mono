# Netlify configuration for Porto Não-Monogâmico
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Optional env vars for community suggestions:
#   GITHUB_TOKEN         - fine-grained/classic token with contents:write
#   GITHUB_REPO          - owner/repo (defaults to stefanoraguiar/porto-nao-mono)
#   GITHUB_BRANCH        - branch to commit to (defaults to main)
#   WEBMASTER_EMAILS     - comma-separated notification list (defaults to stefano@stefanoaguiar.com)
#   RESEND_API_KEY       - optional; enables direct email to webmasters from functions
#   SUGGESTION_FROM_EMAIL - Resend "from" address when RESEND_API_KEY is set
#
# Also configure Netlify Forms notifications for:
#   - event-suggestion
#   - professional-suggestion
# to the same webmaster emails (Site settings → Forms → Form notifications).
