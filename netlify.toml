# Netlify configuration for Porto Não-Monogâmico
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Optional env vars for community suggestions:
#   GITHUB_TOKEN         - required for suggestions + gallery photo removals
#   WEBMASTER_EMAILS     - comma-separated notification list (defaults to stefano@stefanoaguiar.com)
#   RESEND_API_KEY       - optional; enables direct email to webmasters from functions
#   SUGGESTION_FROM_EMAIL - Resend "from" address when RESEND_API_KEY is set
#
# Gallery removals are persisted in src/data/removed-photos.json via
# /.netlify/functions/removed-photos (GET list / POST hide).
#

# Allow OAuth popup (GitHub login) to postMessage back to /admin
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
